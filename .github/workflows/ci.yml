name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            ui-demo-app/package-lock.json
            cypress-ui/package-lock.json

      - name: Install UI demo app dependencies
        run: npm ci --prefix ui-demo-app

      - name: Install Cypress workspace dependencies
        run: npm ci --prefix cypress-ui

      - name: Run Java tests
        run: mvn -B test

      - name: Generate Allure HTML report
        run: npx --yes allure-commandline generate java-automation/target/allure-results --clean -o java-automation/target/allure-report

      - name: Run runtime bridge E2E
        run: npm run e2e:runtime-bridge

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-framework-ci-artifacts
          retention-days: 7
          if-no-files-found: warn
          path: |
            java-automation/target/surefire-reports
            java-automation/target/allure-results
            test-data/runtime

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          retention-days: 7
          if-no-files-found: warn
          path: java-automation/target/allure-report

  publish-allure-report:
    needs: validate
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Allure HTML report
        uses: actions/download-artifact@v4
        with:
          name: allure-html-report
          path: allure-report

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
