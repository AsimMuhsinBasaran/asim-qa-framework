name: Dev Smoke Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Dev Smoke Tests
        run: mvn -B test -Denv=dev -Drunner.class=DevApiTestRunner -Dcucumber.filter.tags="@dev"

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-dev-smoke
          path: java-automation/target/surefire-reports
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-dev-smoke
          path: java-automation/target/allure-results
          if-no-files-found: warn
